<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="utf-8">

    <title>Medicore - Registrar Paciente</title>

    <!-- Custom fonts -->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4e73df 0%, #6f42c1 100%);
            --accent-purple: #6f42c1;
            --accent-blue: #4e73df;
        }

        .text-purple {
            color: var(--accent-purple) !important;
        }

        .btn-purple {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-purple:hover {
            opacity: 0.9;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(111, 66, 193, 0.3);
        }

        .card-custom {
            border: none;
            border-top: 4px solid var(--accent-purple);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 0.2rem rgba(111, 66, 193, 0.25);
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-purple);
            border-bottom: 2px solid #eaecf4;
            padding-bottom: 0.5rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <aside th:replace="~{fragments/employeeSidebar :: employeeSidebar}"></aside>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content" class="p-4 bg-light">

                <!-- Encabezado de la página -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800 font-weight-bold">
                        <i class="bi bi-person-plus-fill text-purple mr-2"></i>Registro de Nuevos Pacientes
                    </h1>
                    <a th:href="@{/empleado/pacientes}" class="btn btn-outline-secondary font-weight-bold btn-sm shadow-sm">
                        <i class="bi bi-arrow-left mr-1"></i> Volver a la Lista
                    </a>
                </div>

                <!-- Formulario Principal -->
                <div class="card shadow card-custom mb-4">
                    <div class="card-header bg-white py-3">
                        <h6 class="m-0 font-weight-bold text-purple">
                            <i class="bi bi-journal-medical mr-2"></i>Información General del Paciente
                        </h6>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/empleado/pacientes/guardar}" method="post">
                            
                            <!-- Sección 1: Datos Personales -->
                            <div class="section-title">
                                <i class="bi bi-person-vcard mr-2"></i>1. Datos Personales
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label class="form-label font-weight-bold small text-gray-700">Tipo de Documento *</label>
                                    <select class="form-control" required>
                                        <option value="" disabled selected>Seleccione...</option>
                                        <option value="CC">Cédula de Ciudadanía (CC)</option>
                                        <option value="TI">Tarjeta de Identidad (TI)</option>
                                        <option value="CE">Cédula de Extranjería (CE)</option>
                                        <option value="PAS">Pasaporte</option>
                                    </select>
                                </div>
                                <div class="form-group col-md-4">
                                    <label class="form-label font-weight-bold small text-gray-700">Número de Documento *</label>
                                    <input type="text" class="form-control" placeholder="Ej. 1020304050" required>
                                </div>
                                <div class="form-group col-md-4">
                                    <label class="form-label font-weight-bold small text-gray-700">Fecha de Nacimiento *</label>
                                    <input type="date" class="form-control" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label class="form-label font-weight-bold small text-gray-700">Nombres *</label>
                                    <input type="text" class="form-control" placeholder="Ej. Carlos Alberto" required>
                                </div>
                                <div class="form-group col-md-4">
                                    <label class="form-label font-weight-bold small text-gray-700">Apellidos *</label>
                                    <input type="text" class="form-control" placeholder="Ej. Gómez Ruiz" required>
                                </div>
                                <div class="form-group col-md-4">
                                    <label class="form-label font-weight-bold small text-gray-700">Género / Sexo *</label>
                                    <select class="form-control" required>
                                        <option value="" disabled selected>Seleccione...</option>
                                        <option value="M">Masculino</option>
                                        <option value="F">Femenino</option>
                                        <option value="O">Otro</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Sección 2: Contacto y Ubicación -->
                            <div class="section-title mt-4">
                                <i class="bi bi-geo-alt-fill mr-2"></i>2. Datos de Contacto y Ubicación
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label class="form-label font-weight-bold small text-gray-700">Teléfono / Celular *</label>
                                    <div class="input-group">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text bg-white"><i class="bi bi-telephone text-purple"></i></span>
                                        </div>
                                        <input type="tel" class="form-control" placeholder="Ej. 3001234567" required>
                                    </div>
                                </div>
                                <div class="form-group col-md-4">
                                    <label class="form-label font-weight-bold small text-gray-700">Correo Electrónico</label>
                                    <div class="input-group">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-purple"></i></span>
                                        </div>
                                        <input type="email" class="form-control" placeholder="correo@ejemplo.com">
                                    </div>
                                </div>

                                <div class="form-group col-md-4">
                                    <label class="form-label font-weight-bold small text-gray-700">Grupo Sanguíneo y RH</label>
                                    <select class="form-control">
                                        <option value="">Desconocido</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                    </select>
                                </div>
                                
                            </div>

                            

                            <!-- Botones de Acción -->
                            <hr class="my-4">
                            <div class="d-flex justify-content-end">
                                <button type="reset" class="btn btn-light border font-weight-bold mr-2">
                                    <i class="bi bi-eraser-fill mr-1"></i> Limpiar
                                </button>
                                <button type="submit" class="btn btn-purple font-weight-bold px-4">
                                    <i class="bi bi-save-fill mr-1"></i> Registrar Paciente
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white shadow-sm mt-auto">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto text-gray-600">
                        <span>Medicore System &copy; 2026</span>
                    </div>
                </div>
            </footer>

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

</body>
</html>
